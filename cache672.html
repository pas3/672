<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="672.manifest">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Bashir Electronic - تثبيت كاش 6.72</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>تثبيت التخزين المؤقت - PS4 6.72</h1>
<hr>
<h1 id="msgs" class="msg-progress" aria-live="polite">بدء تجهيز ملفات 6.72...</h1>
<h1 style="margin-top:43px;font-size:16px;font-weight:normal;color:#fff">
  تعريب وتطوير: <span style="color:#00e1ff">بشير لصيانة الأجهزة الإلكترونية</span>
</h1>
<script>
(function () {
    var el = document.getElementById('msgs');
    function show(message, status) {
        if (!el) return;
        el.textContent = message;
        el.className = 'msg-' + status;
    }
    var appCache = window.applicationCache;
    if (!appCache || !appCache.addEventListener) {
        show('متصفح الجهاز لا يتيح واجهة التخزين المؤقت المطلوبة.', 'failure');
        return;
    }
    appCache.addEventListener('checking', function () {
        show('جارٍ التحقق من ملفات التخزين المؤقت لإصدار 6.72...', 'progress');
    }, false);
    appCache.addEventListener('downloading', function () {
        show('جارٍ تنزيل ملفات 6.72...', 'progress');
    }, false);
    appCache.addEventListener('progress', function (event) {
        if (!event || !event.total) return;
        var percent = Math.round(event.loaded / event.total * 100);
        show('جارٍ تثبيت ذاكرة التخزين المؤقت: ' + '\u2066' + percent + '%' + '\u2069', 'progress');
    }, false);
    function mark672CacheReady() {
        try { window.localStorage.setItem('bashir_672_cache_version', '1'); } catch (e) {}
    }
    function complete() {
        try {
            if (appCache.status === 4 && typeof appCache.swapCache === 'function') appCache.swapCache();
        } catch (e) {}
        mark672CacheReady();
        show('اكتمل تثبيت كاش 6.72 بنجاح ✔ أغلق المتصفح ثم أعد فتح الصفحة.', 'success');
    }
    appCache.addEventListener('cached', complete, false);
    appCache.addEventListener('updateready', complete, false);
    appCache.addEventListener('noupdate', function () {
        if (appCache.status !== 0 && appCache.status !== 5) mark672CacheReady();
        show('الكاش مثبت مسبقاً ولا توجد ملفات جديدة.', 'success');
    }, false);
    if (appCache.status === 1 || appCache.status === 4) mark672CacheReady();
    appCache.addEventListener('error', function () {
        show('فشل تثبيت كاش 6.72. تحقق من ملفات Manifest والاستضافة ثم امسح بيانات الموقع وأعد المحاولة.', 'failure');
    }, false);
})();
</script>
</body>
</html>
